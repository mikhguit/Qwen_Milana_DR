<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#4ade80;font-family:'Nunito',sans-serif;touch-action:none}
  canvas{display:block;touch-action:none}

  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;

           clip-path:path('M8.5 15 C 8.5 15 2 10 2 6 C 2 3.5 4 2 6 2 C 7.5 2 8.5 3 8.5 3 C 8.5 3 9.5 2 11 2 C 13 2 15 3.5 15 6 C 15 10 8.5 15 8.5 15');

  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
  #timeV.low{color:#ff5b5b;animation:pulse .5s steps(2) infinite}

  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;

  .panel{background:linear-gradient(180deg,#e11d48,#be123c);border:4px solid #fff;border-radius:10px;

  .achievement{margin:16px 0;padding:12px;background:linear-gradient(135deg,#fbbf24,#f59e0b);
               border:3px solid #fff;border-radius:10px;box-shadow:0 4px 0 rgba(0,0,0,.3);

         border-radius:10px;padding:12px 14px;cursor:pointer;position:relative;
         box-shadow:0 6px 0 rgba(0,0,0,.4);min-width:104px;display:grid;gap:6px;justify-items:center;

  .blink{animation:blink 1s steps(2) infinite;margin-top:14px;font-size:9px;color:#fff}
  @keyframes blink{50%{opacity:.15}}

  #hint{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);font-family:'Press Start 2P',monospace;
        font-size:14px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.5);opacity:0;transition:opacity .5s;
        z-index:6;pointer-events:none}

  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);font-family:'Press Start 2P',monospace;

         border:2px solid #fff;opacity:0;transition:opacity .25s;z-index:20;pointer-events:none}
  #err{display:none;position:fixed;left:10px;bottom:10px;max-width:70vw;z-index:99;
       font-family:monospace;font-size:12px;color:#fff;background:#e11d48;border:2px solid #fff;
       padding:10px 12px;border-radius:8px;white-space:pre-wrap}

  #touchControls{position:fixed;bottom:20px;left:0;right:0;height:180px;pointer-events:none;z-index:8;
                 display:none;touch-action:none}
  #touchControls.visible{display:block}
  
  #joystickZone{position:absolute;left:20px;bottom:20px;width:140px;height:140px;pointer-events:auto;
                touch-action:none}
  #joystickBase{position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.25);
                border:3px solid rgba(255,255,255,.6);backdrop-filter:blur(4px)}
  #joystickKnob{position:absolute;width:60px;height:60px;border-radius:50%;
                background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),rgba(255,200,220,.9));
                border:3px solid rgba(255,255,255,.9);box-shadow:0 4px 12px rgba(0,0,0,.4);
                left:50%;top:50%;transform:translate(-50%,-50%);transition:transform .05s}
  #joystickKnob.active{background:radial-gradient(circle at 30% 30%,rgba(255,240,200,.95),rgba(255,200,150,.9))}
  
  #actionButtons{position:absolute;right:24px;bottom:20px;display:flex;gap:16px;pointer-events:auto;
                 touch-action:none;align-items:flex-end}
  .actionBtn{width:76px;height:76px;border-radius:50%;border:3px solid rgba(255,255,255,.7);

             font-size:12px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5);cursor:pointer;
             touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .08s,box-shadow .08s;
             backdrop-filter:blur(4px);box-shadow:0 4px 12px rgba(0,0,0,.4)}
  .actionBtn:active{transform:scale(.92)}
  #btnJump{width:100px;height:100px;background:radial-gradient(circle at 35% 35%,rgba(255,150,180,.95),rgba(225,29,72,.9));
           border-color:rgba(255,255,255,.9);font-size:15px}
  
  #mobileHint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
              font-family:'Nunito',sans-serif;font-size:14px;color:rgba(255,255,255,.95);
              text-align:center;pointer-events:none;z-index:7;display:none;
              background:rgba(0,0,0,.6);padding:14px 22px;border-radius:10px}
  #mobileHint.show{display:block}
  
  @media (max-width: 768px){
    #touchControls.visible{display:block}
    #mobileHint.show{display:block}
    .keys{display:none}
  }
</style>

<script>
'use strict';
if(!window.THREE){
  document.getElementById('err').style.display='block';
  document.getElementById('err').textContent='⚠ Three.js не загрузился (нет сети / CDN недоступен).';
  throw new Error('THREE missing');

const touchInput={
  joystick:{active:false,id:null,startX:0,startY:0,dx:0,dy:0,magnitude:0,angle:0,jumpWasArmed:true},
  jump:false,jumpPressed:false,
  init(){
    const zone=document.getElementById('joystickZone');
    const knob=document.getElementById('joystickKnob');
    const btnJump=document.getElementById('btnJump');
    const controls=document.getElementById('touchControls');
    const hint=document.getElementById('mobileHint');
    
    if('ontouchstart' in window || navigator.maxTouchPoints>0){
      controls.classList.add('visible');
      setTimeout(()=>hint.classList.add('show'),1500);
      setTimeout(()=>hint.classList.remove('show'),6000);
    }
    
    zone.addEventListener('touchstart',e=>{
      e.preventDefault();
      const touch=e.changedTouches[0];
      this.joystick.active=true;
      this.joystick.id=touch.identifier;
      this.joystick.startX=touch.clientX;
      this.joystick.startY=touch.clientY;
      this.joystick.dx=0;
      this.joystick.dy=0;
      this.joystick.magnitude=0;
      this.joystick.jumpWasArmed=true;
      knob.classList.add('active');
      this.updateKeys();
    },{passive:false});
    
    zone.addEventListener('touchmove',e=>{
      e.preventDefault();
      if(!this.joystick.active)return;
      const touch=Array.from(e.changedTouches).find(t=>t.identifier===this.joystick.id);
      if(!touch)return;
      
      const maxDist=50;
      let dx=touch.clientX-this.joystick.startX;
      let dy=touch.clientY-this.joystick.startY;
      const dist=Math.sqrt(dx*dx+dy*dy);
      
      if(dist>maxDist){
        const scale=maxDist/dist;
        dx*=scale;dy*=scale;
      }
      
      this.joystick.dx=dx;
      this.joystick.dy=dy;
      this.joystick.magnitude=Math.min(1,dist/maxDist);
      this.joystick.angle=Math.atan2(dy,dx);
      
      knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
      this.updateKeys();
    },{passive:false});
    
    const endJoystick=e=>{
      e.preventDefault();
      const touch=Array.from(e.changedTouches).find(t=>t.identifier===this.joystick.id);
      if(!touch)return;
      this.joystick.active=false;
      this.joystick.id=null;
      this.joystick.dx=0;
      this.joystick.dy=0;
      this.joystick.magnitude=0;
      this.joystick.jumpWasArmed=true;
      knob.classList.remove('active');
      knob.style.transform='translate(-50%,-50%)';
      this.updateKeys();
    };
    
    zone.addEventListener('touchend',endJoystick);
    zone.addEventListener('touchcancel',endJoystick);
    
    const handleJumpStart=e=>{
      e.preventDefault();
      this.jump=true;
      this.jumpPressed=true;
      this.updateKeys();
      btnJump.style.transform='scale(.92)';
    };
    const handleJumpEnd=e=>{
      e.preventDefault();
      this.jump=false;
      this.updateKeys();
      btnJump.style.transform='scale(1)';
    };
    btnJump.addEventListener('touchstart',handleJumpStart,{passive:false});
    btnJump.addEventListener('touchend',handleJumpEnd);
    btnJump.addEventListener('touchcancel',handleJumpEnd);
    
    document.addEventListener('contextmenu',e=>e.preventDefault());
  },
  updateKeys(){
    if(this.joystick.active&&this.joystick.magnitude>0.2){
      const threshold=0.3;
      if(this.joystick.dx<-threshold*this.joystick.magnitude){keys.ArrowLeft=true;keys.ArrowRight=false;}
      else if(this.joystick.dx>threshold*this.joystick.magnitude){keys.ArrowRight=true;keys.ArrowLeft=false;}
      else{keys.ArrowLeft=false;keys.ArrowRight=false;}
    }else{
      keys.ArrowLeft=false;keys.ArrowRight=false;
    }
    keys.Space=this.jump;
  },
  getDirection(){
    if(!this.joystick.active||this.joystick.magnitude<0.2)return 0;
    if(this.joystick.dx<-0.3*this.joystick.magnitude)return -1;
    if(this.joystick.dx>0.3*this.joystick.magnitude)return 1;
    return 0;
  },
  wantsJump(){
    if(!this.joystick.active)return false;
    const upThreshold=-28;
    const wasArmed=this.joystick.jumpWasArmed;
    const isUp=this.joystick.dy<upThreshold && this.joystick.magnitude>0.4;
    if(isUp&&wasArmed){
      this.joystick.jumpWasArmed=false;
      return true;
    }
    if(!isUp&&this.joystick.dy>-18){
      this.joystick.jumpWasArmed=true;
    }
    return false;
  },
  consumeJumpPressed(){
    const v=this.jumpPressed;
    this.jumpPressed=false;
    return v;
  }
};

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const pad=(n,l)=>String(Math.max(0,Math.floor(n))).padStart(l,'0');
let seed=1337; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};

const cleared=new Set();
try{(localStorage.getItem('milana_cleared')||'').split(',').filter(Boolean).forEach(v=>cleared.add(+v));}catch(e){}
function markCleared(lv){
  cleared.add(lv);
  try{localStorage.setItem('milana_cleared',[...cleared].join(','));}catch(e){}
}
function refreshStars(){
  document.querySelectorAll('.lvbtn').forEach(b=>{
    b.querySelector('.star').classList.toggle('hidden',!cleared.has(+b.dataset.lv));
  });
}

const SFX={ctx:null,muted:false,
  ensure(){try{if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(this.ctx.state==='suspended')this.ctx.resume();}catch(e){}},
  tone(f0,f1,d,type='square',v=.13,delay=0){
    if(this.muted||!this.ctx)return;
    const t=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);
    if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+d+.03);},
  jump(){this.tone(400,800,.2,'sine',.1)},
  coin(){this.tone(1047,1047,.08,'sine',.12);this.tone(1319,1319,.24,'sine',.12,.08)},
  stomp(){this.tone(320,80,.16,'triangle',.25)},
  bump(){this.tone(150,110,.09,'square',.18)},
  brick(){this.tone(230,140,.07,'square',.13)},
  step(){this.tone(180,120,.05,'triangle',.04)},
  die(){[660,587,494,392,330,262,196].forEach((f,i)=>this.tone(f,f,.13,'sine',.1,i*.09))},
  clear(){[523,659,784,1047,1319,1568].forEach((f,i)=>this.tone(f,f,.14,'sine',.12,i*.09))},
  world(){[392,523,659,784,1047].forEach((f,i)=>this.tone(f,f,.14,'sine',.12,i*.11))},
  achieve(){[784,988,1175,1319,1568].forEach((f,i)=>this.tone(f,f,.18,'sine',.15,i*.12))}
};

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);
const MAX_ANISO = renderer.capabilities ? renderer.capabilities.getMaxAnisotropy() : 1;

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xfce7f3,44,92);

const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,220);
const CAM_Z=13.5;
let viewH=2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*CAM_Z;

const hemi=new THREE.HemisphereLight(0xffffff,0x22c55e,.9);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0f5,1.2);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-20;sun.shadow.camera.right=20;
sun.shadow.camera.top=20;sun.shadow.camera.bottom=-12;
sun.shadow.camera.near=2;sun.shadow.camera.far=64;
sun.shadow.bias=-0.0004;sun.shadow.normalBias=.03;
scene.add(sun);scene.add(sun.target);
const fill=new THREE.DirectionalLight(0xffd0e8,.35);fill.position.set(-6,8,-4);scene.add(fill);

const LG=new THREE.Group();scene.add(LG);
const SHARED_GEOM={};

function canvasTex(draw,w,h){
  const W=w||128,H=h||W,c=document.createElement('canvas');c.width=W;c.height=H;
  draw(c.getContext('2d'),W,H);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;
  t.anisotropy=Math.min(4,MAX_ANISO);
  return t;
}

const giftTex=canvasTex(g=>{
  g.fillStyle='#e11d48';g.fillRect(0,0,128,128);
  g.strokeStyle='#fff';g.lineWidth=8;
  g.beginPath();g.moveTo(64,0);g.lineTo(64,128);g.moveTo(0,64);g.lineTo(128,64);g.stroke();
  g.strokeStyle='#000';g.lineWidth=3;g.strokeRect(4,4,120,120);
  g.fillStyle='#fff';

const partMats={};
const partMat=c=>partMats[c]||(partMats[c]=new THREE.MeshBasicMaterial({color:c}));
function burst(x,y,z,color,n,spd){
  for(let i=0;i<n;i++){
    let p=parts.find(p=>!p.live);
    if(!p){if(parts.length>150)continue;p={m:new THREE.Mesh(BOX,partMat(color))};scene.add(p.m);parts.push(p);}
    p.m.material=partMat(color);p.m.visible=true;p.live=true;p.t=0;p.life=.42+rnd()*.3;
    p.m.position.set(x+(rnd()-.5)*.3,y,z+(rnd()-.5)*.5);
    const a=rnd()*Math.PI*2,s=spd*(.4+rnd()*.8);
    p.vx=Math.cos(a)*s;p.vy=Math.abs(Math.sin(a))*s+2;p.vz=(rnd()-.5)*2;
  }
}
function updateParts(dt){
  for(const p of parts){ if(!p.live)continue; p.t+=dt;
    if(p.t>p.life){p.live=false;p.m.visible=false;continue;}
    p.vy-=22*dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;
    p.m.scale.setScalar(Math.max(.01,(1-p.t/p.life)*.22));}
}
function coinPop(x,y){
  const g=makeHeartMesh();g.position.set(x,y,0);scene.add(g);pops.push({grp:g,t:0,y0:y});
}
function updatePops(dt){
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.t+=dt;const k=p.t/.55;
    if(k>=1){p.grp.traverse(o=>{if(o.geometry)o.geometry.dispose();});
      scene.remove(p.grp);pops.splice(i,1);continue;}
    p.grp.position.y=p.y0+Math.sin(k*Math.PI)*3;p.grp.rotation.y+=dt*22;}
}

const nearCache=[];
function nearSolids(){
  nearCache.length=0;
  for(let i=0;i<solids.length;i++){
    const s=solids[i];
    if(s.x1<P.x-4||s.x0>P.x+4||s.y1<P.y-6||s.y0>P.y+9)continue;
    nearCache.push(s);
  }
  return nearCache;
}
const overlaps=s=>(P.x+HW>s.x0&&P.x-HW<s.x1&&P.y+HH>s.y0&&P.y-HH<s.y1);
function bumpBlock(s){
  s.bumpT=0;shake=Math.max(shake,.07);
  if(s.kind==='q'&&!s.used){
    s.used=true;s.ref.material=M.qused;
    coinPop((s.x0+s.x1)/2,s.y1+.45);
    burst((s.x0+s.x1)/2,s.y1+.5,0xe11d48,9,4);
    coinCount++;heartsCollected++;score+=200;SFX.coin();updateHUD();
  }else if(s.kind==='brick'){
    SFX.brick();burst((s.x0+s.x1)/2,s.y1+.1,0xe11d48,6,3);
  }else SFX.bump();
}
function moveX(dx){
  if(dx===0)return;
  P.x+=dx;
  for(const s of nearSolids()){
    if(!overlaps(s))continue;
    P.x = dx>0 ? s.x0-HW-EPS : s.x1+HW+EPS;
    P.vx=0;
    break;
  }
}
function moveY(dy){
  P.grounded=false;
  if(dy===0)return;
  P.y+=dy;
  let best=null,pen=Infinity;
  for(const s of nearSolids()){
    if(!overlaps(s))continue;
    const p = dy>0 ? (P.y+HH)-s.y0 : s.y1-(P.y-HH);
    if(p<pen){pen=p;best=s;}
  }
  if(!best)return;
  const ovx=Math.min(P.x+HW,best.x1)-Math.max(P.x-HW,best.x0);
  const mid=(best.x0+best.x1)/2;
  if(dy>0){
    if(ovx<0.18&&best.kind!=='ground'&&best.kind!=='wall'){
      P.x = P.x<mid ? best.x0-HW-EPS : best.x1+HW+EPS;
    }else{
      P.y=best.y0-HH-EPS; P.vy=-2; bumpBlock(best);
    }
  }else{
    const feet=P.y-HH;
    if(ovx<0.18&&feet<best.y1-0.5&&best.kind!=='ground'&&best.kind!=='wall'){
      P.x = P.x<mid ? best.x0-HW-EPS : best.x1+HW+EPS;
    }else{
      const impact=-P.vy;
      P.y=best.y1+HH+EPS; P.vy=0; P.grounded=true;
      if(impact>16){burst(P.x,best.y1+.05,.25,0xffffff,7,3.2);P.squashT=0;shake=Math.min(.12,impact*.004);}
      else if(impact>10)P.squashT=0;
    }
  }
}
function unstick(){
  for(const s of nearSolids()) if(overlaps(s)) P.y=s.y1+HH+EPS;
}

function updatePlay(dt){
  timer-=dt;
  if(timer<=0){timer=0;updateHUD();kill();return;}

  let dir=touchInput.getDirection();
  if(dir===0){
    const left =keys.ArrowLeft ||keys.KeyA||keys['a']||keys['ф'];
    const right=keys.ArrowRight||keys.KeyD||keys['d']||keys['в'];
    if(left&&!right)dir=-1;
    else if(right&&!left)dir=1;
  }
  
  const run = keys.ShiftLeft || keys.ShiftRight || touchInput.joystick.magnitude > 0.7;
  const max=run?MAX_RUN:MAX_WALK;

  if(dir!==0){
    P.face=dir;
    const turning=P.vx*dir<-0.01;
    const a=turning?(P.grounded?FRICTION+18:TURN_DECEL):(P.grounded?ACC:AIR_ACC);
    P.vx=clamp(P.vx+dir*a*dt,-max,max);
    if(P.grounded&&turning&&Math.abs(P.vx)>6){
      P.skidT-=dt;
      if(P.skidT<=0){P.skidT=.06;burst(P.x,.05,.2,0x22c55e,2,2);}
    }
  }else{
    const f=(P.grounded?FRICTION:AIR_DRIFT)*dt;
    P.vx = P.vx>0 ? Math.max(0,P.vx-f) : Math.min(0,P.vx+f);
  }

  if(touchInput.consumeJumpPressed()){
    P.jumpBuf=JBUF;
  }
  if(touchInput.wantsJump()){
    P.jumpBuf=JBUF;
  }

  const jh=jumpHeld();
  if(P.prevJH&&!jh&&P.vy>0)P.vy*=0.45;
  P.prevJH=jh;

  P.coyote=P.grounded?COYOTE:P.coyote-dt;
  P.jumpBuf-=dt;
  if(P.jumpBuf>0&&P.coyote>0){
    P.vy=JUMP_V;P.grounded=false;P.coyote=0;P.jumpBuf=0;P.stretchT=0;
    SFX.jump();burst(P.x,.06,.2,0xffffff,5,2);
  }

  P.vy=clamp(P.vy+(P.vy>0&&jh?G_HOLD:G_FALL)*dt,MAX_FALL,30);

  moveX(P.vx*dt);
  moveY(P.vy*dt);
  unstick();

  if(P.inv>0)P.inv-=dt;
  if(P.y-HH<-2.5){kill();return;}

  if(P.grounded&&Math.abs(P.vx)>6){P.stepT-=dt;
    if(P.stepT<=0){P.stepT=.22;burst(P.x-P.face*.3,.06,.2,0xffffff,3,1.5);SFX.step();}}

  updateEnemies(dt);updateCoins(dt);

  if(P.x>POLE_X-1.2){state='flag';flagPhase=0;P.vx=0;P.vy=0;SFX.clear();}
}
function updateEnemies(dt){
  for(const e of enemies){
    if(!e.active){ if(Math.abs(e.x-P.x)<24)e.active=true; else continue; }
    if(e.dead){ e.squash+=dt;e.grp.scale.y=Math.max(.15,1-e.squash*6);
      if(e.squash>.5)e.grp.visible=false; continue; }
    e.t+=dt;
    e.x+=e.dir*e.sp*dt;
    const ahead=e.x+e.dir*.7;
    let turn=!overGround(ahead);
    if(!turn)for(const s of solids){
      if((s.kind==='pipe'||s.kind==='stair'||s.kind==='base'||s.kind==='wall')&&s.y0<1&&
         ahead>s.x0-.3&&ahead<s.x1+.3){turn=true;break;}
    }
    if(turn)e.dir*=-1;
    e.grp.position.set(e.x,Math.abs(Math.sin(e.t*9))*.06,0);
    e.flip.rotation.y=e.dir>0?0:Math.PI;
    const sh=Math.sin(e.t*14)*.14;e.fL.position.x=sh;e.fR.position.x=-sh;

    if(state!=='play')continue;

    const dx=P.x-e.x, adx=Math.abs(dx), feet=P.y-HH;

    if(!P.grounded&&P.vy<-2&&feet>0&&feet<1.7&&adx>0.25&&adx<1.25){
      const oldX=P.x, step=Math.min(3*dt,adx-0.2);
      P.x-=Math.sign(dx)*step;
      for(const s of nearSolids()){ if(overlaps(s)){P.x=oldX;break;} }
    }

    if(adx<HW+0.72&&feet<0.95&&P.y+HH>0.02){
      if(P.vy<-1.0&&feet>0.10){
        e.dead=true;score+=100;SFX.stomp();shake=.1;
        burst(e.x,.5,0x4b5563,10,4);
        P.y=Math.max(P.y,0.95+HH);
        P.vy=jumpHeld()?19:12;P.stretchT=0;
        updateHUD();
      }else if(adx<HW+0.48&&P.inv<=0){
        kill();
      }
    }
  }
}
function updateCoins(dt){
  for(const c of coins){
    if(c.taken)continue;
    c.grp.position.y=c.y+Math.sin(clockT*2.2+c.ph)*.16;
    c.grp.rotation.y=clockT*3.4+c.ph;
    if(Math.abs(P.x-c.x)<.85&&Math.abs(P.y-c.y)<1.3){
      c.taken=true;c.grp.visible=false;coinCount++;heartsCollected++;score+=200;
      burst(c.x,c.y,0,0xe11d48,8,4);SFX.coin();updateHUD();
    }
  }
}
function updateBlocks(dt){
  for(const s of solids){
    if(s.bumpT<.3&&s.ref){s.bumpT+=dt;
      s.ref.position.y=s.baseY+Math.sin(Math.min(1,s.bumpT/.28)*Math.PI)*.45;}
  }
}
function updateDead(dt){
  deathT+=dt;P.vy+=G_FALL*dt;P.y+=P.vy*dt;
  if(P.y<-10||deathT>2.6){
    if(lives>0)respawn();
    else{state='over';showModal('ИГРА ОКОНЧЕНА','УРОВЕНЬ '+currentLevel+' • ОЧКИ '+pad(score,6),'ЗАНОВО','retry');}
  }
}
function updateFlag(dt){
  if(flagPhase===0){
    P.x=POLE_X-1.15;P.face=-1;P.grounded=false;P.y-=7*dt;
    flagMesh.position.y=Math.max(2.4,P.y+.4);
    if(P.y<=HH){P.y=HH;P.x=POLE_X+1.25;P.face=1;P.vy=6;flagPhase=1;}
  }else if(flagPhase===1){
    P.vx=6.5;P.vy=clamp(P.vy+G_FALL*dt,MAX_FALL,30);
    moveX(P.vx*dt);moveY(P.vy*dt);
    if(P.x>=CASTLE_X-.6){
      playerAlpha=false;flagPhase=2;
      markCleared(currentLevel);
      timeBonus=Math.ceil(timer)*10;score+=timeBonus;
      
      const gotAchievement=heartsCollected>=totalHearts && totalHearts>0;
      if(gotAchievement){
        score+=1000;
      }
      
      updateHUD(true);
      
      if(currentLevel<LAST_LEVEL){
        showModal('УРОВЕНЬ '+currentLevel+' ПРОЙДЕН!','БОНУС ВРЕМЕНИ '+timeBonus+
                  '<br><br>ОЧКИ '+pad(score,6),
                  'УРОВЕНЬ '+(currentLevel+1)+' ▶','next',gotAchievement);
      }else{
        showModal(' С ДНЁМ РОЖДЕНИЯ, МИЛАНА! 🎉','БОНУС ВРЕМЕНИ '+timeBonus+
                  '<br><br>ИТОГО ОЧКИ '+pad(score,6)+
                  '<br>СЕРДЕЧКИ ×'+pad(coinCount,2),'ИГРАТЬ СНОВА','restart',gotAchievement);
      }
      state='clear';fwT=0;
      
      if(birthdaySign){
        birthdaySign.visible=true;
        birthdaySign.scale.set(0,0,0);
      }
    }
  }
}
function updateClear(dt){
  fwT-=dt;
  if(fwT<=0){fwT=.38;
    burst(CASTLE_X+(rnd()-.5)*16,7+rnd()*7,-1,
      [0xfbbf24,0xe11d48,0x3b82f6,0x22c55e,0xa855f7][Math.floor(rnd()*5)],14,6);}
  
  if(birthdaySign && birthdaySign.visible){
    const t=Math.min(1,(clockT%10)/.8);
    const scale=lerp(0,1,t);
    birthdaySign.scale.set(scale,scale,scale);
    birthdaySign.rotation.y=Math.sin(clockT*2)*.15;
    birthdaySign.position.y=8+Math.sin(clockT*1.5)*.3;
  }
}
function updateClouds(dt){
  for(const c of clouds){
    c.g.position.x-=c.sp*dt;
    if(c.g.position.x<camX-46)c.g.position.x+=92;
    if(c.g.position.x>camX+46)c.g.position.x-=92;
  }
}
function updateCamera(dt){
  const look=P.x+P.face*1.5+clamp(P.vx*.22,-2.6,2.6);
  camX=lerp(camX,clamp(look,viewH*.5,LEVEL_END-viewH*.5),Math.min(1,6*dt));
  camY=lerp(camY,4.5+Math.max(0,P.y-3.5)*.5,Math.min(1,5*dt));
  shake=Math.max(0,shake-dt*(.4+shake*6));
  const sx=(rnd()-.5)*shake,sy=(rnd()-.5)*shake;
  camera.position.set(camX+sx,camY+sy,CAM_Z);
  camera.lookAt(camX+sx,camY+sy-.3,0);
  sun.position.set(P.x+8,17,10);sun.target.position.set(P.x,0,0);
}

function posePlayer(dt){
  const sp=Math.abs(P.vx), moving=P.grounded&&sp>.5, air=!P.grounded;
  if(moving)P.runPhase+=dt*(7+sp*.6);
  const amp=moving?Math.min(1,sp/7):0;
  const sw=Math.sin(P.runPhase)*.95*amp;

  let hl,hr,kl,kr,al,ar,el;
  if(air){
    const up=P.vy>1;
    hl=up?.8:.4; hr=up?-.5:-.35;
    kl=up?-1.05:-.25; kr=up?-.4:-.15;
    al=up?2.4:2.0; ar=up?2.1:1.7; el=.55;
  }else{
    hl=sw; hr=-sw;
    kl=-Math.max(0,Math.sin(P.runPhase+1.1))*.95*amp;
    kr=-Math.max(0,Math.sin(P.runPhase+1.1+Math.PI))*.95*amp;
    al=-sw*.75; ar=sw*.75; el=.4+Math.abs(sw)*.5;
  }
  const L=(cur,tgt,k)=>lerp(cur,tgt,Math.min(1,k));
  PL.legL.hip.rotation.z=L(PL.legL.hip.rotation.z,hl,.4);
  PL.legR.hip.rotation.z=L(PL.legR.hip.rotation.z,hr,.4);
  PL.legL.knee.rotation.z=L(PL.legL.knee.rotation.z,kl,.4);
  PL.legR.knee.rotation.z=L(PL.legR.knee.rotation.z,kr,.4);
  PL.armL.sho.rotation.z=L(PL.armL.sho.rotation.z,al,.32);
  PL.armR.sho.rotation.z=L(PL.armR.sho.rotation.z,ar,.32);
  PL.armL.elb.rotation.z=L(PL.armL.elb.rotation.z,el,.32);
  PL.armR.elb.rotation.z=L(PL.armR.elb.rotation.z,el,.32);

  const lean=-clamp(P.vx*.022,-.22,.22)*(air?.5:1);
  torso.rotation.z=L(torso.rotation.z,lean,.18);
  torso.position.y=.62+(moving?Math.abs(Math.sin(P.runPhase))*.05:Math.sin(clockT*2)*.012);
  head.rotation.z=L(head.rotation.z,-torso.rotation.z*.6+(air?(P.vy>0?.12:-.06):0),.22);

  let sy=1;
  if(P.squashT<.18)sy=lerp(.8,1,P.squashT/.18);
  else if(P.stretchT<.16)sy=lerp(1.14,1,P.stretchT/.16);
  if(state==='title')sy=1+Math.sin(clockT*2.4)*.02;
  P.squashT+=dt;P.stretchT+=dt;
  playerGroup.scale.set(1+(1-sy)*.6,sy,1+(1-sy)*.6);

  blinkT-=dt;
  if(blinkT<0)blinkT=2+rnd()*3.5;
  const bl=blinkT<.12?.15:1;
  for(const e of PL.eyes)e.scale.y=bl;

  playerGroup.rotation.y=P.face>0?0:Math.PI;
  playerGroup.visible=(P.inv<=0||Math.floor(P.inv*14)%2===0)&&playerAlpha;
}

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.033,(now-last)/1000);last=now;clockT+=dt;

  if(state!=='paused'){
    if(state==='play')updatePlay(dt);
    else if(state==='dead')updateDead(dt);
    else if(state==='flag')updateFlag(dt);
    else if(state==='clear')updateClear(dt);
    updateBlocks(dt);updatePops(dt);updateParts(dt);updateClouds(dt);
    playerGroup.position.set(P.x,P.y-HH,0);
    posePlayer(dt);
  }
  if(state==='title'){
    camX=8+Math.sin(clockT*.12)*2;camY=4.5;
    camera.position.set(camX,camY,CAM_Z);camera.lookAt(camX,camY-.3,0);
    sun.position.set(camX+8,17,10);sun.target.position.set(camX,0,0);
  }else updateCamera(dt);

  updateHUD();
  renderer.render(scene,camera);
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  viewH=2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*CAM_Z;
});

touchInput.init();
refreshStars();
loadLevel(1);
state='title';
requestAnimationFrame(frame);
</script>
</body>
